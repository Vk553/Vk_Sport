name: Daily Match Data Update

on:
  # Run every day at 5:00 AM UTC
  schedule:
    - cron: '0 5 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
  
  # Optional: Run on push to main for testing
  push:
    branches:
      - main
    paths:
      - 'scripts/update_matches.py'
      - '.github/workflows/daily_matches.yml'

jobs:
  update_matches:
    name: Update Match Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run match data update script
        run: |
          python scripts/update_matches.py
        env:
          APISPORT_ONLINE_KEY: ${{ secrets.APISPORT_ONLINE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      
      - name: Verify matches.json was updated
        run: |
          if [ -f "data/matches.json" ]; then
            echo "✅ matches.json exists"
            echo "File size: $(wc -c < data/matches.json) bytes"
            echo "First few lines:"
            head -20 data/matches.json
          else
            echo "❌ matches.json was not created"
            exit 1
          fi
      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chrono: Auto-update daily matches schedule [skip ci]'
          commit_options: '--no-verify'
          push_options: '--no-verify'
          skip_dirty_check: false
          skip_fetch: true
          skip_checkout: false
          create_branch: false
          branch: main
          file_pattern: 'data/matches.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          echo "## 🎯 Match Data Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Match data pipeline completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Updated Files" >> $GITHUB_STEP_SUMMARY
          echo "- \`data/matches.json\` - Match schedule and ad configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚽ Team Filtering" >> $GITHUB_STEP_SUMMARY
          echo "Only matches featuring major teams from England, Spain, Italy, Germany, France, and Saudi Arabia are included." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏰ Next Scheduled Run" >> $GITHUB_STEP_SUMMARY
          echo "Tomorrow at 5:00 AM UTC" >> $GITHUB_STEP_SUMMARY
