name: Auto Update Match Status

on:
  # Runs every 10 minutes, around the clock, so match status
  # (UPCOMING -> LIVE -> ENDED) updates automatically based on
  # kickoff time. This does NOT fetch anything from any external
  # football API — it only recalculates status for the matches
  # you already entered manually in data/matches.json.
  #
  # Note: GitHub's scheduler is best-effort and can be delayed
  # by a few minutes during high load periods.
  schedule:
    - cron: '*/10 * * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

  # Optional: Run on push to main for testing
  push:
    branches:
      - main
    paths:
      - 'scripts/update_matches.py'
      - '.github/workflows/daily_matches.yml'
      - 'data/matches.json'

jobs:
  update_status:
    name: Update Match Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run match status update script
        run: |
          python scripts/update_matches.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-update match status [skip ci]'
          commit_options: '--no-verify'
          push_options: '--no-verify'
          skip_dirty_check: false
          skip_fetch: true
          skip_checkout: false
          create_branch: false
          branch: main
          file_pattern: 'data/matches.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
